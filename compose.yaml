name: my-square
services:
  yiipress:
    image: ${YIIPRESS_IMAGE:-ghcr.io/yiipress/engine-static:nightly}
    platform: linux/amd64
    profiles: [tools]
    working_dir: /site
    volumes:
      - .:/site

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/app
      - app_runtime:/app/runtime
      - app_assets:/app/public/assets
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-my_square}
      DB_USER: ${POSTGRES_USER:-my_square}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-my_square}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - .:/app:ro
      - app_assets:/app/public/assets:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_square}
      POSTGRES_USER: ${POSTGRES_USER:-my_square}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_square}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  app_runtime:
  app_assets:

server {
    listen 80;
    server_name _;
    root /app/output;
    index index.html;

    # Динамические маршруты всегда обрабатывает приложение.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass app:9000;
    }

    # Динамические маршруты имеют приоритет над статическим контентом.
    location ~ ^/(auth|account|admin|moderation)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass app:9000;
    }

    location /assets/ {
        try_files $uri @backend_assets;
    }

    location @backend_assets {
        root /app/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @backend;
    }

    location @backend {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass app:9000;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
